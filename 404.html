<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not found — Ajithkumar Dhevarajan</title>
<meta name="robots" content="noindex, follow" />
<script>
(function(){try{var s=localStorage.getItem("theme")||"system";
var d=window.matchMedia("(prefers-color-scheme: dark)").matches;
var r=s==="system"?(d?"dark":"light"):s;
document.documentElement.dataset.theme=r;}catch(e){}})();
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/css/styles.css" />
<style>
  .nf{min-height:100svh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;gap:20px;padding:0 var(--pad)}
  .nf .code{font-family:var(--mono);font-size:clamp(3rem,12vw,7rem);color:var(--accent);
      letter-spacing:-.04em}
</style>
</head>
<body>
<main class="nf">
  <p class="code">404</p>
  <h1>This page wandered off.</h1>
  <p class="prose">The link is broken or the page no longer exists.</p>
  <a class="btn primary" href="/">Back home</a>
</main>
</body>
</html>
